name: Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version name (e.g. 1.0.0); creates tag v1.0.0'
        required: true
        type: string
      version_code:
        description: 'Android version code: positive integer, greater than all previous releases'
        required: true
        type: string
      prerelease:
        description: Mark as prerelease
        default: false
        type: boolean
permissions:
  contents: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_CODE: ${{ inputs.version_code }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Validate release inputs and tag
        shell: bash
        run: |
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]] || { echo 'Expected version such as 1.0.0 or 1.1.0-beta.1'; exit 1; }
          if ! [[ "$RELEASE_CODE" =~ ^[1-9][0-9]{0,9}$ ]] || (( RELEASE_CODE > 2100000000 )); then
            echo 'Invalid Android version code'; exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v$RELEASE_VERSION"; then
            echo 'This release tag already exists'; exit 1
          else
            status=$?
            [[ "$status" == 2 ]] || exit "$status"
          fi
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
      - name: Install Android SDK packages
        run: |
          ANDROID_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "$ANDROID_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | "$ANDROID_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_ROOT/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo 'Missing ANDROID_KEYSTORE_BASE64 secret'; exit 1; }
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/home-release.p12"
      - name: Check and build signed release
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/home-release.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: home
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: >-
          ./gradlew --no-daemon testReleaseUnitTest lintRelease assembleRelease
          -PreleaseVersion="$RELEASE_VERSION" -PreleaseVersionCode="$RELEASE_CODE"
      - name: Verify APK and prepare assets
        run: |
          mkdir -p release
          apk="release/Home-$RELEASE_VERSION.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$apk"
          (cd release && sha256sum "Home-$RELEASE_VERSION.apk" > SHA256SUMS.txt)
      - name: Publish GitHub release
        env:
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          args=()
          if [[ "$PRERELEASE" == true ]]; then args+=(--prerelease); fi
          gh release create "v$RELEASE_VERSION" release/* \
            --target "$GITHUB_SHA" --title "Home $RELEASE_VERSION" \
            --generate-notes "${args[@]}"
      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/home-release.p12"
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-reports
          path: app/build/reports/
          retention-days: 14
